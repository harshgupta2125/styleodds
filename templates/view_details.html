{% extends 'base.html' %}
{% load static tailwind_tags %}
{% load static %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Details - StyleOdds</title>
  {% tailwind_css %}
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Poppins", sans-serif;
    }
    .fade-in-up {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1s forwards;
    }
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body class="bg-slate-700 text-white">



<!-- Hero Section -->
<section class="relative py-20 bg-cover bg-center" style="background-image: url('{% static '/images/fashion-hero.jpg' %}');">
  <div class="absolute inset-0 bg-gradient-to-b from-blue-900 via-blue-800 to-slate-900 opacity-80"></div>
  <div class="text-center text-white relative z-10 fade-in-up">
    <h1 class="text-5xl md:text-7xl font-extrabold mb-6">Product Details</h1>
    <p class="text-xl md:text-2xl mb-8 font-light text-gray-200">
      Discover Your Perfect Style
    </p>
  </div>
</section>

<!-- Product Details -->
<section class="container mx-auto px-6 py-12">
  <div id="product" class="grid md:grid-cols-2 gap-10">
    <!-- Product Info will load here -->
  </div>
</section>

<!-- Scripts -->
<script>
  async function loadProduct() {
    const id = localStorage.getItem('productId');
    if (!id) {
      window.location.href = "{% url 'shop' %}";
      return;
    }

    const res = await fetch(`https://dummyjson.com/products/${id}`);
    const product = await res.json();
    const priceInINR = Math.round(product.price * 83.5);

    const productHTML = `
      <div class="fade-in-up">
        <img src="${product.thumbnail}" alt="${product.title}" class="w-full h-[500px] object-cover rounded-xl shadow-lg">
      </div>
      <div class="fade-in-up">
        <h1 class="text-3xl font-bold mb-4 text-white">${product.title}</h1>
        <p class="text-xl text-blue-400 mb-6">₹${priceInINR}</p>
        <p class="mb-6 text-gray-300">${product.description}</p>
        <div class="flex items-center gap-4">
          <button onclick="addToCart(${product.id}, '${product.title}', ${priceInINR}, '${product.thumbnail}')" 
            class="bg-blue-500 text-white font-semibold py-3 px-8 rounded-full hover:bg-blue-600 transition">
            Add to Cart
          </button>
          <a href="{% url 'shop' %}" class="text-gray-300 hover:text-white transition-colors underline">
            &larr; Back to Shop
          </a>
        </div>
      </div>
    `;

    document.getElementById('product').innerHTML = productHTML;
  }

  function addToCart(id, title, price, image) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    const existingProduct = cart.find((item) => item.id === id);
    if (existingProduct) {
      existingProduct.quantity += 1;
    } else {
      cart.push({ id, title, price, image, quantity: 1 });
    }
    localStorage.setItem("cart", JSON.stringify(cart));
    updateCartCount();
    alert("Item added to cart!");
  }

  function updateCartCount() {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    const cartCount = document.getElementById("cart-count");
    cartCount.textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
  }

  loadProduct();
  updateCartCount();
</script>

</body>
</html>

{% endblock %}
