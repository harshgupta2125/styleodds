{% extends 'base.html' %}
{% load static %}

{% block content %}
    <!-- Hero Section -->
    <section class="relative py-20 bg-cover bg-center" style="background-image: url('{% static 'core/images/fashion-hero.jpg' %}');">
      <div class="absolute inset-0 bg-gradient-to-b from-blue-900 via-blue-800 to-slate-900 opacity-80"></div>
      <div class="text-center text-white relative z-10 fade-in-up">
        <h1 class="text-5xl md:text-7xl font-extrabold mb-6">Shop Collection</h1>
        <p class="text-xl md:text-2xl mb-8 font-light text-gray-200">
          Discover Our Latest Arrivals
        </p>
      </div>
    </section>

    <!-- Filters -->
    <section class="container mx-auto px-6 py-12">
      <div class="flex flex-wrap gap-4 justify-center">
        <button onclick="filterProducts('all')" class="px-5 py-2 rounded-full bg-blue-500 text-white hover:bg-blue-600 transition">
          All
        </button>
        <button onclick="filterProducts('mens-shirts')" class="px-5 py-2 rounded-full bg-blue-500 text-white hover:bg-blue-600 transition">
          Men's Shirts
        </button>
        <button onclick="filterProducts('womens-dresses')" class="px-5 py-2 rounded-full bg-blue-500 text-white hover:bg-blue-600 transition">
          Women's Dresses
        </button>
        <button onclick="filterProducts('womens-shoes')" class="px-5 py-2 rounded-full bg-blue-500 text-white hover:bg-blue-600 transition">
          Women's Shoes
        </button>
        <button onclick="filterProducts('tops')" class="px-5 py-2 rounded-full bg-blue-500 text-white hover:bg-blue-600 transition">
          Tops
        </button>
        <button onclick="filterProducts('mens-shoes')" class="px-5 py-2 rounded-full bg-blue-500 text-white hover:bg-blue-600 transition">
          Men's Shoes
        </button>
        <button onclick="filterProducts('womens-bags')" class="px-5 py-2 rounded-full bg-blue-500 text-white hover:bg-blue-600 transition">
          Women's Bags
        </button>
      </div>
    </section>

    <!-- Products -->
    <section class="container mx-auto px-6 py-12">
      <div id="products" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-8">
        <!-- Products load here -->
      </div>

      <!-- Pagination -->
      <div class="flex justify-center items-center space-x-6 mt-12">
        <button id="prevPage" onclick="previousPage()" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition disabled:opacity-50" disabled>
          Previous
        </button>
        <span id="currentPage" class="text-white font-semibold">Page 1</span>
        <button id="nextPage" onclick="nextPage()" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition">
          Next
        </button>
      </div>

      <!-- Loader -->
      <div id="loader" class="text-center my-6 hidden">
        <span class="text-gray-300">Loading more products...</span>
      </div>
    </section>
{% endblock %}
