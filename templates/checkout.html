{% extends 'base.html' %}
{% load static %}

{% block extra_head %}
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    .fade-in-up {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1s forwards;
    }
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
{% endblock %}

{% block content %}
<!-- Hero Section -->
<section class="relative py-20 bg-cover bg-center" style="background-image: url('{% static 'images/fashion-hero.jpg' %}');">
  <div class="absolute inset-0 bg-gradient-to-b from-blue-900 via-blue-800 to-slate-900 opacity-80"></div>
  <div class="text-center text-white relative z-10 fade-in-up">
    <h1 class="text-5xl md:text-7xl font-extrabold mb-6">Checkout</h1>
    <p class="text-xl md:text-2xl mb-8 font-light text-gray-200">
      Complete Your Purchase
    </p>
  </div>
</section>

<!-- Checkout Section -->
<section class="container mx-auto px-6 py-10">
  <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
    <!-- Billing Details -->
    <div class="bg-slate-800 p-6 rounded-xl shadow-lg fade-in-up">
      <h3 class="text-2xl font-semibold mb-6 text-white">Billing Details</h3>
      <form id="checkout-form" action="/create-checkout-session/" method="POST">
        {% csrf_token %}
        <div class="space-y-4">
          <div>
            <label class="block mb-2 font-medium text-gray-300">Full Name</label>
            <input type="text" name="name" required class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block mb-2 font-medium text-gray-300">Email Address</label>
            <input type="email" name="email" required class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block mb-2 font-medium text-gray-300">Phone Number</label>
            <input type="text" name="phone" required class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block mb-2 font-medium text-gray-300">Shipping Address</label>
            <input type="text" name="address" required class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block mb-2 font-medium text-gray-300">City</label>
            <input type="text" name="city" required class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block mb-2 font-medium text-gray-300">Postal Code</label>
            <input type="text" name="postal_code" required class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
        <button type="submit" class="mt-6 bg-blue-500 w-full text-white py-3 px-6 rounded-full text-lg hover:bg-blue-600 transition">
          Pay Online
        </button>
      </form>
    </div>

    <!-- Order Summary -->
    <div class="bg-slate-800 p-6 rounded-xl shadow-lg fade-in-up">
      <h3 class="text-2xl font-semibold mb-6 text-white">Order Summary</h3>
      <div id="order-summary" class="space-y-4 text-gray-300">
        <!-- Dynamically list products from cart here -->
      </div>
      <hr class="my-4 border-slate-600">
      <div class="flex justify-between text-xl font-bold text-white">
        <span>Total</span>
        <span id="order-total">₹0</span>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script>
  function loadSummary() {
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    let summaryContainer = document.getElementById('order-summary');
    let total = 0;
    summaryContainer.innerHTML = '';

    if (cart.length === 0) {
      summaryContainer.innerHTML = '<p class="text-gray-300">Your cart is empty</p>';
      document.getElementById('order-total').textContent = '₹0';
      return;
    }

    cart.forEach(item => {
      const itemHTML = `
        <div class="flex justify-between text-lg">
          <span class="text-gray-300">${item.title} x${item.quantity}</span>
          <span class="text-gray-300">₹${item.price * item.quantity}</span>
        </div>
      `;
      total += item.price * item.quantity;
      summaryContainer.insertAdjacentHTML('beforeend', itemHTML);
    });

    // Add shipping charges only if there are items in cart
    const shippingCharge = 100;
    total += shippingCharge;
    
    // Add shipping charge to the summary
    summaryContainer.insertAdjacentHTML('beforeend', `
      <div class="flex justify-between text-lg mt-4">
        <span class="text-gray-300">Shipping</span>
        <span class="text-gray-300">₹${shippingCharge}</span>
      </div>
    `);

    document.getElementById('order-total').textContent = `₹${total}`;
  }

  loadSummary();

  const form = document.getElementById('checkout-form');
  form.addEventListener('submit', function(event) {
    event.preventDefault();

    const totalText = document.getElementById('order-total').textContent;
    const amount = parseFloat(totalText.replace('₹', ''));
    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
    const stripe = Stripe('{{ STRIPE_PUBLISHABLE_KEY }}'); // Make sure to pass this from settings

    fetch('/create-checkout-session/', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': csrfToken
      },
      body: JSON.stringify({
        'amount': amount,
        'product': 'StyleOdds Purchase' 
      })
    })
    .then(response => response.json())
    .then(session => {
      if (session.error) {
        alert(session.error);
        return;
      }
      return stripe.redirectToCheckout({ sessionId: session.id });
    })
    .then(function(result) {
      if (result.error) {
        alert(result.error.message);
      }
    })
    .catch(error => {
      console.error('Error:', error);
    });
  });
</script>
{% endblock %}
